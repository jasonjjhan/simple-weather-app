name: CampusLoop public URL diagnostic

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-hosts:
    runs-on: ubuntu-latest
    steps:
      - name: Test candidate public URLs in headless Chrome
        shell: bash
        run: |
          set +e
          google-chrome --version || chromium --version || true
          candidates=(
            "statically-fixed|https://cdn.statically.io/gh/jasonjjhan/simple-weather-app@b468fe4345373d7250e959753e64e1afd78669b7/index.html"
            "statically-main|https://cdn.statically.io/gh/jasonjjhan/simple-weather-app@main/index.html"
            "raw-githack|https://raw.githack.com/jasonjjhan/simple-weather-app/main/index.html"
            "htmlpreview|https://htmlpreview.github.io/?https://github.com/jasonjjhan/simple-weather-app/blob/main/index.html"
          )
          PASS=0
          for item in "${candidates[@]}"; do
            name="${item%%|*}"
            url="${item#*|}"
            echo "===== $name ====="
            code=$(curl -L -sS --connect-timeout 15 --max-time 60 -o "/tmp/${name}.html" -w "%{http_code}" "$url" || echo 000)
            bytes=$(wc -c < "/tmp/${name}.html" 2>/dev/null || echo 0)
            ctype=$(curl -L -sSI --connect-timeout 15 --max-time 30 "$url" | awk -F': ' 'tolower($1)=="content-type" {v=$2} END {gsub("\r", "", v); print v}')
            echo "HTTP_STATUS=$code"
            echo "CONTENT_TYPE=$ctype"
            echo "RAW_BYTES=$bytes"
            chrome=$(command -v google-chrome || command -v chromium || true)
            if [ -n "$chrome" ]; then
              timeout 80s "$chrome" --headless --disable-gpu --no-sandbox --ignore-certificate-errors --virtual-time-budget=20000 --dump-dom "$url" > "/tmp/${name}.dom" 2>"/tmp/${name}.err"
              dom_bytes=$(wc -c < "/tmp/${name}.dom" 2>/dev/null || echo 0)
              echo "DOM_BYTES=$dom_bytes"
              if grep -Eq '全國探索|交友／抽學伴|社團工作台|家長觀測|贊助夥伴' "/tmp/${name}.dom"; then
                echo "CAMPUSLOOP_APP_RENDERED=true"
                PASS=$((PASS+1))
              else
                echo "CAMPUSLOOP_APP_RENDERED=false"
                echo "DOM_TITLE=$(grep -o '<title>[^<]*' "/tmp/${name}.dom" | head -1 || true)"
                tail -30 "/tmp/${name}.err" || true
              fi
            fi
          done
          echo "TOTAL_RENDERED_URLS=$PASS"
          test "$PASS" -ge 1
