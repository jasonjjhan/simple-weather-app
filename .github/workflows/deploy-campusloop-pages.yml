name: Deploy CampusLoop V3 to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  diagnostic:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verify CampusLoop public URL from an external GitHub runner
        shell: bash
        run: |
          URL="https://jasonjjhan.github.io/simple-weather-app/"
          curl -L -sS --connect-timeout 15 --max-time 45 -D /tmp/headers.txt -o /tmp/page.html "$URL"
          CODE=$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' /tmp/headers.txt)
          BYTES=$(wc -c < /tmp/page.html)
          echo "CAMPUSLOOP_URL=$URL"
          echo "CAMPUSLOOP_HTTP_STATUS=$CODE"
          echo "CAMPUSLOOP_RESPONSE_BYTES=$BYTES"
          if grep -qi "CampusLoop" /tmp/page.html; then
            echo "CAMPUSLOOP_CONTENT_FOUND=true"
          else
            echo "CAMPUSLOOP_CONTENT_FOUND=false"
            echo "----- RESPONSE PREVIEW -----"
            head -c 500 /tmp/page.html || true
            exit 1
          fi
          test "$CODE" = "200"

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    if: always() && github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout for status report
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Verify the public website
        shell: bash
        run: |
          URL="https://jasonjjhan.github.io/simple-weather-app/"
          CODE="000"
          MATCH="false"
          BYTES="0"
          for attempt in $(seq 1 18); do
            CODE=$(curl -L -sS --connect-timeout 10 --max-time 30 -o /tmp/campusloop.html -w "%{http_code}" "$URL" || true)
            BYTES=$(wc -c < /tmp/campusloop.html 2>/dev/null || echo 0)
            if [ "$CODE" = "200" ] && grep -qi "CampusLoop" /tmp/campusloop.html; then
              MATCH="true"
              break
            fi
            sleep 10
          done
          cat > deployment-status.json <<EOF
          {
            "url": "$URL",
            "http_status": "$CODE",
            "campusloop_content_found": $MATCH,
            "response_bytes": $BYTES,
            "deploy_job_result": "${{ needs.deploy.result }}",
            "workflow_run_id": "${{ github.run_id }}",
            "verified_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat deployment-status.json

      - name: Save verification result to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment-status.json
          git commit -m "Record CampusLoop Pages verification" || exit 0
          git push origin HEAD:main
