name: Verify CampusLoop public URL

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-url:
    runs-on: ubuntu-latest
    steps:
      - name: Test public URLs with headless Chrome
        shell: bash
        run: |
          set +e
          candidates=(
            "rawcdn|https://rawcdn.githack.com/jasonjjhan/simple-weather-app/3b64bcf4ee486106e30e239b8cd9c44669c17378/campusloop-live/index.html"
            "htmlpreview-blob|https://htmlpreview.github.io/?https://github.com/jasonjjhan/simple-weather-app/blob/3b64bcf4ee486106e30e239b8cd9c44669c17378/campusloop-live/index.html"
            "htmlpreview-raw|https://htmlpreview.github.io/?https://raw.githubusercontent.com/jasonjjhan/simple-weather-app/3b64bcf4ee486106e30e239b8cd9c44669c17378/campusloop-live/index.html"
            "statically|https://cdn.statically.io/gh/jasonjjhan/simple-weather-app@3b64bcf4ee486106e30e239b8cd9c44669c17378/campusloop-live/index.html"
            "jsdelivr|https://cdn.jsdelivr.net/gh/jasonjjhan/simple-weather-app@3b64bcf4ee486106e30e239b8cd9c44669c17378/campusloop-live/index.html"
          )
          PASS=0
          for item in "${candidates[@]}"; do
            name="${item%%|*}"
            url="${item#*|}"
            echo "===== $name ====="
            code=$(curl -L -sS --connect-timeout 15 --max-time 60 -o "/tmp/${name}.raw" -w "%{http_code}" "$url" || echo 000)
            ctype=$(curl -L -sSI --connect-timeout 15 --max-time 30 "$url" | awk -F': ' 'tolower($1)=="content-type" {v=$2} END {gsub("\r", "", v); print v}')
            echo "URL=$url"
            echo "HTTP_STATUS=$code"
            echo "CONTENT_TYPE=$ctype"
            chrome=$(command -v google-chrome || command -v chromium || true)
            timeout 90s "$chrome" --headless --disable-gpu --no-sandbox --ignore-certificate-errors --virtual-time-budget=30000 --dump-dom "$url" > "/tmp/${name}.dom" 2>"/tmp/${name}.err"
            bytes=$(wc -c < "/tmp/${name}.dom" 2>/dev/null || echo 0)
            title=$(grep -o '<title>[^<]*' "/tmp/${name}.dom" | head -1 || true)
            echo "DOM_BYTES=$bytes"
            echo "DOM_TITLE=$title"
            if [ "$bytes" -gt 40000 ] \
              && grep -q '<div class="app">' "/tmp/${name}.dom" \
              && grep -q '找到社團、抽到學伴' "/tmp/${name}.dom" \
              && grep -q 'AI 影像實驗社｜完整社團工作台' "/tmp/${name}.dom" \
              && grep -q '星河高中｜全校社團管理中樞' "/tmp/${name}.dom" \
              && grep -q '贊助夥伴總覽' "/tmp/${name}.dom" \
              && ! grep -q '目前無法載入 DEMO' "/tmp/${name}.dom"; then
                echo "FULL_APP_RENDERED=true"
                PASS=$((PASS+1))
            else
                echo "FULL_APP_RENDERED=false"
                tail -20 "/tmp/${name}.err" || true
            fi
          done
          echo "TOTAL_FULL_RENDERED=$PASS"
          test "$PASS" -ge 1
