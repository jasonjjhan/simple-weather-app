<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="CampusLoop 高校社群 × 社團作業系統 × AI 成長平台公開測試 DEMO"><title>CampusLoop｜高校社群平台公開測試 DEMO</title><style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;padding:24px;background:linear-gradient(145deg,#f4f7ff,#fbf6ff);color:#1c2450}.box{width:min(620px,100%);padding:36px;border:1px solid rgba(61,87,212,.12);border-radius:26px;background:#fff;box-shadow:0 18px 60px rgba(44,69,180,.14);text-align:center}.spinner{width:46px;height:46px;border:5px solid #dfe6ff;border-top-color:#36f;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}h1{font-size:24px;margin:0 0 8px}p{margin:0;color:#68719c;line-height:1.7}small{display:block;margin-top:14px;color:#9098bb}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="box"><div class="spinner"></div><h1>CampusLoop DEMO 載入中</h1><p>正在開啟高校社群 × 社團作業系統 × AI 成長平台。</p><small>公開測試版｜所有人物、學校、活動與數據皆為示範資料</small></div><script>(async()=>{try{if(!('DecompressionStream'in window))throw Error('unsupported');const p=await Promise.all([0,1,2,3].map(async i=>{const r=await fetch(`data${i}.txt`,{cache:'no-store'});if(!r.ok)throw Error('load');return r.text()}));const b=p.join('').replace(/\s/g,'');const x=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const t=await new Response(new Blob([x]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(t);document.close()}catch(e){document.body.innerHTML='<div class="box"><h1>目前無法載入 DEMO</h1><p>請改用最新版 Chrome、Edge、Safari 或 Firefox後重新整理。</p></div>';console.error(e)}})();</script></body></html>
